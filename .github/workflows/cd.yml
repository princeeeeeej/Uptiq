name: Deploy on docker

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.api
          push: true
          tags: |
            princejais0310/uptiq-api:latest
            princejais0310/uptiq-api:${{ github.sha }}

      - name: Build Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.frontend
          push: true
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
          tags: |
            princejais0310/uptiq-frontend:latest
            princejais0310/uptiq-frontend:${{ github.sha }}

      - name: Build Pusher
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.pusher
          push: true
          tags: |
            princejais0310/uptiq-pusher:latest
            princejais0310/uptiq-pusher:${{ github.sha }}

      - name: Build Worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.worker
          push: true
          tags: |
            princejais0310/uptiq-worker:latest
            princejais0310/uptiq-worker:${{ github.sha }}

      - name: Build DB Writer
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.dbwriter
          push: true
          tags: |
            princejais0310/uptiq-dbwriter:latest
            princejais0310/uptiq-dbwriter:${{ github.sha }}